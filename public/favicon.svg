<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g >
    <!-- smoke -->
    <path d="M404 222 C 380 192 426 172 400 138 C 378 110 420 88 398 56" fill="none" stroke="#c4b5fd" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
    <path d="M430 210 C 452 186 420 166 442 140" fill="none" stroke="#a5b4fc" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
    <!-- cranium + cheekbones -->
    <path d="M232 96 C 142 96 88 160 88 236 C 88 284 110 316 142 334 L 142 372 C 142 388 154 400 170 400 L 294 400 C 310 400 322 388 322 372 L 322 334 C 354 316 376 284 376 236 C 376 160 322 96 232 96 Z" fill="url(#bone)"/>
    <!-- cracks -->
    <path d="M262 104 L 252 136 L 268 152" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- eye sockets (slightly angled = attitude) -->
    <path d="M136 236 C 136 206 166 196 196 210 C 214 218 214 254 196 270 C 172 290 136 276 136 236 Z" fill="#1e1b4b"/>
    <path d="M328 236 C 328 206 298 196 268 210 C 250 218 250 254 268 270 C 292 290 328 276 328 236 Z" fill="#1e1b4b"/>
    <circle cx="180" cy="242" r="9" fill="#a78bfa" opacity="0.9"/>
    <circle cx="284" cy="242" r="9" fill="#a78bfa" opacity="0.9"/>
    <!-- nose -->
    <path d="M232 280 L 216 316 Q 232 324 248 316 Z" fill="#1e1b4b"/>
    <!-- teeth -->
    <rect x="158" y="344" width="148" height="44" rx="10" fill="#e2e8f0"/>
    <path d="M188 344 V 388 M 218 344 V 388 M 246 344 V 388 M 276 344 V 388" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <path d="M160 366 H 304" stroke="#475569" stroke-width="5"/>
    <!-- cigarette in the corner of the mouth -->
    <g transform="rotate(-16 286 368)">
      <rect x="276" y="356" width="128" height="26" rx="6" fill="#f8fafc"/>
      <rect x="276" y="356" width="36" height="26" rx="6" fill="#d97706"/>
      <rect x="306" y="356" width="6" height="26" fill="#b45309"/>
      <rect x="396" y="356" width="14" height="26" rx="5" fill="#ef4444"/>
      <circle cx="408" cy="369" r="30" fill="url(#ember)"/>
    </g>
  </g>
</svg>